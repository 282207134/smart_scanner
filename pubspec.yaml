publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  image: ^4.12.0
  pdf: ^3.13.1
  archive: ^4.5.1
  dartcv4: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
